<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wuxing Zodiac Fashion - Lucky Style & Fortune</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/solozhangxiru/fengshui_skill_api/main/%E5%A4%B4%E5%83%8F.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a103f, #2c1a5f, #4a2a8f);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #f0e6ff;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .form-box {
            background: rgba(255,255,255,0.08);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            text-align: left;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 16px;
        }

        button {
            background: linear-gradient(90deg, #9d50ff, #7a3dd9);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .result {
            background: rgba(255,255,255,0.07);
            padding: 25px;
            border-radius: 14px;
            text-align: left;
            line-height: 1.7;
        }

        .section-title {
            font-size: 20px;
            margin: 30px 0 15px;
        }

        .info-table {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="https://raw.githubusercontent.com/solozhangxiru/fengshui_skill_api/main/%E5%A4%B4%E5%83%8F.png" alt="Logo">
        <h1>Wuxing Zodiac Fashion</h1>
        <p class="subtitle">Your Lucky Color & Best Fashion Style Advisor</p>

        <div class="form-box">
            <div class="form-group">
                <label>Your Birthday (YYYY-MM-DD)</label>
                <input type="date" id="birthDate">
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                </select>
            </div>
            <div class="form-group">
                <label>Scene</label>
                <select id="scene">
                    <option value="work">Work</option>
                    <option value="date">Date</option>
                    <option value="casual">Casual</option>
                    <option value="party">Party</option>
                    <option value="sport">Sport</option>
                    <option value="formal">Formal</option>
                    <option value="festival">Festival</option>
                </select>
            </div>
            <button>Get My Lucky Style</button>
        </div>

        <div class="result" id="result" style="display:none;">
            <h3>Your Result</h3>
            <p>Zodiac: <span id="zodiac"></span></p>
            <p>Element (Wuxing): <span id="wuxing"></span></p>
            <p>Lucky Color: <span id="color"></span></p>
            <p>Best Style: <span id="style"></span></p>
        </div>

        <h2 class="section-title">About This Skill</h2>
        <div class="info-table">
            <p>✅ Analyze Zodiac & Five Elements</p>
            <p>✅ Personal Lucky Color</p>
            <p>✅ Fashion Style for Every Scene</p>
            <p>✅ 100% Free & Easy to Use</p>
        </div>
    </div>
</body>
</html>
