<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wuxing Zodiac Fashion | Your Personal Lucky Style Guide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a103f 0%, #311b72 50%, #4c1d95 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #fff;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            display: block;
            background: url('https://cdn-icons-png.flaticon.com/512/1149/1149166.png') center/cover no-repeat;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #e0e7ff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #c9b8f0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Form Card */
        .form-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: #e2d8f7;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 2px #a78bfa;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #8b46e8, #6c2cd0);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background: linear-gradient(90deg, #9c5af5, #7d3de0);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(147, 51, 234, 0.3);
        }

        .submit-btn:disabled {
            background: #6b21a8;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Card */
        .result-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .result-header h2 {
            font-size: 1.8rem;
            color: #e0e7ff;
        }

        .section-block {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.12);
        }

        .section-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.3rem;
            color: #a78bfa;
            margin-bottom: 1rem;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .detail-card {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 10px;
        }

        .detail-card h4 {
            color: #e0e7ff;
            margin-bottom: 0.5rem;
        }

        .detail-card p {
            color: #c9b8f0;
            font-size: 0.95rem;
        }

        .color-tags {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .color-tag {
            background: rgba(167, 139, 250, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(167, 139, 250, 0.3);
            color: #e0e7ff;
        }

        .advice-box {
            background: rgba(167, 139, 250, 0.1);
            padding: 1.2rem;
            border-radius: 10px;
            margin-top: 1rem;
            border-left: 3px solid #a78bfa;
        }

        .advice-box p {
            color: #e2d8f7;
            line-height: 1.7;
        }

        /* About Section */
        .about-section {
            text-align: center;
            margin-top: 3rem;
        }

        .about-section h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #e0e7ff;
        }

        .feature-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 2rem;
            border-radius: 18px;
        }

        .feature-list li {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            color: #e2d8f7;
        }

        .feature-list li::before {
            content: "✅";
        }

        /* Loading & Error */
        .loading {
            text-align: center;
            padding: 3rem 0;
            color: #a78bfa;
            font-size: 1.2rem;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 2rem;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon"></div>
            <h1>Wuxing Zodiac Fashion</h1>
            <p>Your Personal Lucky Color & Style Advisor</p>
        </div>

        <div class="form-card">
            <form id="form">
                <div class="form-group">
                    <label for="birthDate">Your Birthday (YYYY-MM-DD)</label>
                    <input type="date" id="birthDate" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="scene">Occasion</label>
                    <select id="scene" required>
                        <option value="Work">Work / Office</option>
                        <option value="Date">Date / Romantic</option>
                        <option value="Daily">Daily Casual</option>
                        <option value="Party">Party / Social Event</option>
                        <option value="Sport">Sport / Fitness</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Get My Lucky Style</button>
            </form>
        </div>

        <div id="result"></div>

        <div class="about-section">
            <h2>About This Skill</h2>
            <ul class="feature-list">
                <li>Analyze Zodiac & Five Elements</li>
                <li>Personalized Lucky Color</li>
                <li>Fashion Tips for Every Occasion</li>
                <li>100% Free & Easy to Use</li>
            </ul>
        </div>
    </div>

    <script>
        // 中文数据翻译 + 扩展解读函数
        function translateAndExpandResult(data, gender, scene) {
            const zodiacAnimalMap = {
                "马": {name: "Horse", meaning: "Symbolizes freedom, energy, and positivity"},
                "牛": {name: "Ox", meaning: "Symbolizes diligence, stability, and reliability"},
                "虎": {name: "Tiger", meaning: "Symbolizes courage, leadership, and confidence"},
                "兔": {name: "Rabbit", meaning: "Symbolizes gentleness, kindness, and elegance"},
                "龙": {name: "Dragon", meaning: "Symbolizes power, luck, and ambition"},
                "蛇": {name: "Snake", meaning: "Symbolizes wisdom, intuition, and adaptability"},
                "羊": {name: "Goat", meaning: "Symbolizes peace, harmony, and creativity"},
                "猴": {name: "Monkey", meaning: "Symbolizes intelligence, wit, and versatility"},
                "鸡": {name: "Rooster", meaning: "Symbolizes punctuality, honesty, and confidence"},
                "狗": {name: "Dog", meaning: "Symbolizes loyalty, honesty, and protection"},
                "猪": {name: "Pig", meaning: "Symbolizes abundance, kindness, and sincerity"},
                "鼠": {name: "Rat", meaning: "Symbolizes intelligence, adaptability, and wealth"}
            };

            const zodiacSignMap = {
                "白羊座": "Aries", "金牛座": "Taurus", "双子座": "Gemini",
                "巨蟹座": "Cancer", "狮子座": "Leo", "处女座": "Virgo",
                "天秤座": "Libra", "天蝎座": "Scorpio", "射手座": "Sagittarius",
                "摩羯座": "Capricorn", "水瓶座": "Aquarius", "双鱼座": "Pisces"
            };

            const fiveElementsMap = {
                "金": {name: "Metal", trait: "Determined, strong-willed, and disciplined"},
                "木": {name: "Wood", trait: "Creative, growth-oriented, and flexible"},
                "水": {name: "Water", trait: "Intuitive, adaptable, and empathetic"},
                "火": {name: "Fire", trait: "Passionate, energetic, and charismatic"},
                "土": {name: "Earth", trait: "Stable, reliable, and nurturing"}
            };

            const sceneAdvice = {
                "Work": "For work occasions, your lucky colors will help you project confidence and professionalism, making a strong impression in meetings and presentations.",
                "Date": "For romantic occasions, your lucky colors will enhance your charm and warmth, helping you create a memorable and attractive presence.",
                "Daily": "For daily casual wear, your lucky colors will bring you positive energy and comfort, keeping you in a good mood throughout the day.",
                "Party": "For social events, your lucky colors will make you stand out in the crowd, attracting attention and good luck.",
                "Sport": "For sports activities, your lucky colors will boost your energy and vitality, helping you perform better and stay motivated."
            };

            return {
                zodiacAnimal: zodiacAnimalMap[data.zodiacAnimal] || {name: data.zodiacAnimal, meaning: "A symbol of good fortune and positive energy"},
                zodiacSign: zodiacSignMap[data.zodiacSign] || data.zodiacSign,
                fiveElements: fiveElementsMap[data.fiveElements] || {name: data.fiveElements, trait: "Balanced and harmonious energy"},
                sceneAdvice: sceneAdvice[scene] || "Your lucky colors will bring you positive energy and good fortune in this occasion.",
                suggestions: {
                    recommendedColor: data.suggestions.recommendedColor,
                    outfitAdvice: data.suggestions.outfitAdvice,
                    fiveElementsTip: data.suggestions.fiveElementsTip,
                    luckyColors: data.suggestions.luckyColors
                }
            };
        }

        document.getElementById('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const birthDate = document.getElementById('birthDate').value;
            const gender = document.getElementById('gender').value;
            const scene = document.getElementById('scene').value;
            const resultDiv = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Analyzing Your Fortune...';
            resultDiv.innerHTML = '<div class="loading">✨ Calculating your Zodiac and Five Elements...</div>';

            try {
                const res = await fetch(`/api/index.js?birthDate=${birthDate}&gender=${gender}&scene=${scene}`);
                const rawData = await res.json();

                if (!res.ok) throw new Error('Failed to fetch your style analysis');

                // 翻译并扩展数据
                const data = translateAndExpandResult(rawData, gender, scene);

                resultDiv.innerHTML = `
                    <div class="result-card">
                        <div class="result-header">
                            <span>✨</span>
                            <h2>Your Personalized Lucky Style</h2>
                        </div>

                        <!-- 1. 基础运势板块 -->
                        <div class="section-block">
                            <div class="section-title">
                                <span>📊</span>
                                <h3>Your Basic Fortune Profile</h3>
                            </div>
                            <div class="detail-grid">
                                <div class="detail-card">
                                    <h4>Chinese Zodiac</h4>
                                    <p>${data.zodiacAnimal.name}</p>
                                    <p style="font-size:0.85rem; opacity:0.8; margin-top:0.5rem;">${data.zodiacAnimal.meaning}</p>
                                </div>
                                <div class="detail-card">
                                    <h4>Western Zodiac</h4>
                                    <p>${data.zodiacSign}</p>
                                </div>
                                <div class="detail-card">
                                    <h4>Five Elements</h4>
                                    <p>${data.fiveElements.name}</p>
                                    <p style="font-size:0.85rem; opacity:0.8; margin-top:0.5rem;">${data.fiveElements.trait}</p>
                                </div>
                            </div>
                        </div>

                        <!-- 2. 推荐幸运色板块 -->
                        <div class="section-block">
                            <div class="section-title">
                                <span>🎨</span>
                                <h3>Recommended Lucky Color</h3>
                            </div>
                            <div class="advice-box">
                                <p><strong>Your Signature Color:</strong> ${data.suggestions.recommendedColor}</p>
                                <p style="margin-top:0.5rem;">This color resonates perfectly with your ${data.fiveElements.name} energy, helping you attract positive luck and confidence.</p>
                            </div>
                        </div>

                        <!-- 3. 场景穿搭建议板块 -->
                        <div class="section-block">
                            <div class="section-title">
                                <span>👗</span>
                                <h3>Outfit Advice for ${scene}</h3>
                            </div>
                            <div class="advice-box">
                                <p>${data.suggestions.outfitAdvice}</p>
                                <p style="margin-top:1rem; font-style:italic;">💡 ${data.sceneAdvice}</p>
                            </div>
                        </div>

                        <!-- 4. 五行幸运提示板块 -->
                        <div class="section-block">
                            <div class="section-title">
                                <span>💡</span>
                                <h3>Five Elements Lucky Tip</h3>
                            </div>
                            <div class="advice-box">
                                <p>${data.suggestions.fiveElementsTip}</p>
                            </div>
                        </div>

                        <!-- 5. 所有幸运色板块 -->
                        <div class="section-block">
                            <div class="section-title">
                                <span>🌈</span>
                                <h3>All Your Lucky Colors</h3>
                            </div>
                            <p style="margin-bottom:1rem;">These colors are aligned with your ${data.fiveElements.name} energy and can bring you positive fortune:</p>
                            <div class="color-tags">
                                ${data.suggestions.luckyColors.map(color => `<span class="color-tag">${color}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                resultDiv.innerHTML = `<div class="error">❌ Oops! Something went wrong: ${err.message}</div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Get My Lucky Style';
            }
        });
    </script>
</body>
</html>
