<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五行星座穿搭 API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d4b8 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #3a2b1f;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(139, 90, 43, 0.15);
            border: 1px solid rgba(139, 90, 43, 0.2);
        }
        h1 {
            text-align: center;
            color: #8b5a2b;
            margin-bottom: 30px;
            font-size: 28px;
            letter-spacing: 2px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #5a4535;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d4b89a;
            border-radius: 8px;
            font-size: 16px;
            background: #fffaf5;
            color: #3a2b1f;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5a2b 0%, #a67c52 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(139, 90, 43, 0.2);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 90, 43, 0.3);
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            background: rgba(245, 230, 211, 0.6);
            border-radius: 8px;
            border-left: 4px solid #8b5a2b;
        }
        #result h3 {
            color: #8b5a2b;
            margin-bottom: 15px;
        }
        .result-item {
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .loading {
            text-align: center;
            color: #8b5a2b;
            font-style: italic;
        }
        .error {
            color: #d9534f;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>五行星座穿搭 API</h1>
        
        <div class="form-group">
            <label for="birthDate">生日（YYYY-MM-DD）</label>
            <input type="date" id="birthDate" value="1995-08-15">
        </div>

        <div class="form-group">
            <label for="gender">性别</label>
            <select id="gender">
                <option value="女">女</option>
                <option value="男">男</option>
            </select>
        </div>

        <div class="form-group">
            <label for="scene">场景</label>
            <select id="scene">
                <option value="职场">职场</option>
                <option value="约会">约会</option>
                <option value="日常">日常</option>
                <option value="正式场合">正式场合</option>
                <option value="运动">运动</option>
                <option value="派对">派对</option>
            </select>
        </div>

        <div class="form-group">
            <label for="colorPreference">偏好颜色（可选）</label>
            <input type="text" id="colorPreference" placeholder="如：红色、蓝色">
        </div>

        <button onclick="getStyleSuggestion()">获取穿搭建议</button>

        <div id="result"></div>
    </div>

    <script>
        const API_URL = "https://fengshui-skill-api.vercel.app/api/index.js";

        async function getStyleSuggestion() {
            const birthDate = document.getElementById("birthDate").value;
            const gender = document.getElementById("gender").value;
            const scene = document.getElementById("scene").value;
            const colorPreference = document.getElementById("colorPreference").value;
            const resultDiv = document.getElementById("result");

            if (!birthDate || !gender || !scene) {
                resultDiv.innerHTML = `<p class="error">请填写所有必填项！</p>`;
                return;
            }

            resultDiv.innerHTML = `<p class="loading">正在计算星座与五行搭配...</p>`;

            const params = new URLSearchParams({
                birthDate,
                gender,
                scene,
                colorPreference: colorPreference || ""
            });

            try {
                const response = await fetch(`${API_URL}?${params}`);
            if (!response.ok) throw new Error("请求失败");
            const data = await response.json();

            resultDiv.innerHTML = `
                <h3>✨ 你的专属穿搭建议</h3>
                <div class="result-item"><strong>星座：</strong>${data.zodiac}</div>
                <div class="result-item"><strong>五行属性：</strong>${data.fiveElements}</div>
                <div class="result-item"><strong>推荐颜色：</strong>${data.suggestions.recommendedColor}</div>
                <div class="result-item"><strong>穿搭建议：</strong>${data.suggestions.outfitAdvice}</div>
                <div class="result-item"><strong>五行运势提升：</strong>${data.suggestions.fiveElementsTip}</div>
                <div class="result-item"><strong>幸运色列表：</strong>${data.suggestions.luckyColors.join('、')}</div>
            `;
        } catch (error) {
            resultDiv.innerHTML = `<p class="error">获取建议失败：${error.message}</p>`;
        }
    }
</script>
